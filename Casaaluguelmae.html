<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel das Casas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#10293b;        /* azul-petróleo profundo — estrutura */
    --ink-soft:#3c5a6e;
    --paper:#f7f4ee;      /* papel claro, não-branco puro */
    --paper-deep:#efe9dc;
    --line:#d9d1bd;
    --terra:#c1612f;      /* terracota — acento de ação */
    --terra-deep:#a14b22;
    --olive:#5c6e3f;       /* saldo positivo */
    --rust:#a3402c;        /* saldo negativo / alerta */
    --gold:#c79a3d;        /* destaque secundário */
    --white:#fffdf9;
    --shadow: 0 1px 0 rgba(16,41,59,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .display{font-family:'Fraunces',serif;}

  /* ---------- App shell ---------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:0 16px 100px;
  }

  header.top{
    padding:28px 16px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
  }
  header.top .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top .tagline{
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  header.top .today{
    font-size:.82rem;
    color:var(--ink-soft);
    text-align:right;
  }

  /* ---------- Casa selector pills ---------- */
  .casa-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 14px;
    margin-bottom:18px;
    -webkit-overflow-scrolling:touch;
  }
  .casa-tabs::-webkit-scrollbar{display:none;}
  .casa-pill{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .casa-pill:hover{border-color:var(--ink-soft);}
  .casa-pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .casa-pill .dot{
    display:inline-block;
    width:7px;height:7px;border-radius:50%;
    margin-right:7px;
    position:relative; top:-1px;
  }

  /* ---------- Bottom nav (mobile-first) ---------- */
  nav.bottom{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--white);
    border-top:1.5px solid var(--ink);
    display:flex;
    z-index:40;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    padding:10px 1px 8px;
    font-family:'Inter',sans-serif;
    font-size:.56rem;
    font-weight:700;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  nav.bottom button .icon{ font-size:1.1rem; }
  nav.bottom button .icon{font-size:1.25rem;}
  nav.bottom button.active{color:var(--terra);}
  nav.bottom button.active .icon{transform:translateY(-1px);}

  /* ---------- Sections ---------- */
  section{display:none;}
  section.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-size:1.25rem;
    font-weight:600;
    margin:0 0 14px;
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .card-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }

  /* ---------- Metric grid (dashboard) ---------- */
  .metric-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  @media(min-width:640px){
    .metric-grid{grid-template-columns:repeat(4,1fr);}
  }
  .metric{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px 16px 14px;
    position:relative;
    overflow:hidden;
  }
  .metric .label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .metric .value{
    font-family:'Fraunces',serif;
    font-size:1.55rem;
    font-weight:600;
    line-height:1.1;
  }
  .metric .sub{
    font-size:.72rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .metric.accent-terra .value{color:var(--terra-deep);}
  .metric.accent-olive .value{color:var(--olive);}
  .metric.accent-rust .value{color:var(--rust);}

  /* ---------- House ranking bars ---------- */
  .rank-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--paper-deep);
  }
  .rank-row:last-child{border-bottom:none;}
  .rank-name{
    width:140px;
    flex:0 0 140px;
    font-size:.82rem;
    font-weight:600;
    color:var(--ink);
  }
  .rank-bar-wrap{
    flex:1;
    height:10px;
    background:var(--paper-deep);
    border-radius:6px;
    overflow:hidden;
  }
  .rank-bar{
    height:100%;
    border-radius:6px;
    background:linear-gradient(90deg, var(--terra), var(--gold));
  }
  .rank-value{
    width:88px;
    flex:0 0 88px;
    text-align:right;
    font-size:.8rem;
    font-weight:600;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Lists (reservas / custos) ---------- */
  .list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--paper-deep);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .who{
    font-weight:600;
    font-size:.92rem;
  }
  .list-item .meta{
    font-size:.75rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .list-item .amount{
    font-weight:700;
    font-size:.95rem;
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .channel-tag{
    display:inline-block;
    font-size:.65rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 7px;
    border-radius:5px;
    margin-right:6px;
  }
  .channel-airbnb{background:#fde7d8; color:#a14b22;}
  .channel-booking{background:#dbe7f0; color:#1f4f6e;}
  .channel-pix, .channel-direto{background:#e4ead8; color:#4a5c2e;}
  .channel-outro{background:#ece6da; color:#6b6048;}

  /* ---------- Forms ---------- */
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .form-grid .full{grid-column:1 / -1;}
  label{
    display:block;
    font-size:.72rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  input, select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:.92rem;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--terra);
    background:var(--white);
  }
  .field{margin-bottom:0;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 20px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--terra); color:var(--white);}
  .btn-primary:hover{background:var(--terra-deep);}
  .btn-ghost{background:none; border:1.5px solid var(--line); color:var(--ink-soft);}
  .btn-block{width:100%;}
  .btn-fab{
    position:fixed;
    bottom:78px;
    right:18px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--terra);
    color:var(--white);
    font-size:1.6rem;
    box-shadow:0 6px 16px rgba(161,75,34,.35);
    z-index:35;
    border:none;
    cursor:pointer;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(16,41,59,.45);
    z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper);
    width:100%;
    max-width:560px;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:slideup .22s ease;
  }
  @media(min-width:640px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:18px; max-height:84vh;}
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .modal-head h3{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    margin:0;
  }
  .modal-close{
    background:none; border:none;
    font-size:1.3rem;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px;
  }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty .icon{font-size:2.2rem; margin-bottom:10px;}
  .empty p{font-size:.86rem; margin:4px 0;}

  /* ---------- Channel filter chips ---------- */
  .chip-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .chip{
    padding:6px 13px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:.76rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .month-divider{
    font-size:.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--terra-deep);
    margin:18px 0 6px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .month-divider:first-child{margin-top:0;}

  .toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--paper);
    padding:11px 20px;
    border-radius:10px;
    font-size:.84rem;
    font-weight:600;
    z-index:60;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading-bar{
    height:3px;
    background:linear-gradient(90deg, transparent, var(--terra), transparent);
    background-size:200% 100%;
    animation:loadbar 1.1s infinite;
    border-radius:3px;
  }
  @keyframes loadbar{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

  .helper-text{font-size:.74rem; color:var(--ink-soft); margin-top:4px;}

  /* ---------- Sync status bar ---------- */
  .sync-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-radius:10px;
    font-size:.76rem;
    font-weight:600;
    margin-bottom:14px;
    cursor:pointer;
    border:1.5px solid transparent;
  }
  .sync-dot{
    width:8px; height:8px;
    border-radius:50%;
    flex:0 0 auto;
  }
  .sync-link{
    margin-left:auto;
    text-decoration:underline;
    font-size:.74rem;
  }
  .sync-cinza{background:#ece6da; color:#6b6048;}
  .sync-cinza .sync-dot{background:#9b9078;}
  .sync-amarelo{background:#fbf0d2; color:#8a6d1d;}
  .sync-amarelo .sync-dot{background:#c79a3d; animation:pulse 1s infinite;}
  .sync-verde{background:#e4ead8; color:#4a5c2e;}
  .sync-verde .sync-dot{background:#5c6e3f;}
  .sync-vermelho{background:#f6dcd5; color:#8a3220;}
  .sync-vermelho .sync-dot{background:#a3402c;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  pre#codigo-script{ -webkit-user-select:text; user-select:text; }
  code{ background:var(--paper-deep); padding:1px 5px; border-radius:4px; font-size:.85em; }

  .dot-inline{
    display:inline-block;
    width:8px; height:8px; border-radius:50%;
    margin-right:8px;
    position:relative; top:-1px;
  }
  .casa-pill-add{
    border-style:dashed;
    color:var(--terra-deep);
    border-color:var(--terra);
  }

  /* ---------- Recebimentos ---------- */
  .receb-card{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:14px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .receb-head{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--paper-deep);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .receb-hospede{
    font-weight:700;
    font-size:.94rem;
  }
  .receb-desc{
    font-size:.76rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .receb-total-val{
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    font-weight:600;
    text-align:right;
    white-space:nowrap;
  }
  .parcela-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 16px;
    border-bottom:1px solid var(--paper-deep);
  }
  .parcela-row:last-child{ border-bottom:none; }
  .parcela-info{ flex:1; }
  .parcela-valor{
    font-weight:700;
    font-size:.9rem;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    min-width:80px;
    text-align:right;
  }
  .badge{
    display:inline-block;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:6px;
    margin-top:3px;
  }
  .badge-pendente{ background:#fde7d8; color:#a14b22; }
  .badge-recebido{ background:#e4ead8; color:#4a5c2e; }
  .btn-baixa{
    flex:0 0 auto;
    padding:7px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:.74rem;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-baixa.receber{ border-color:var(--olive); color:var(--olive); }
  .btn-baixa.estornar{ border-color:var(--line); color:var(--ink-soft); font-weight:500; }

  /* ---------- Filtro de período (painel) ---------- */
  .periodo-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
    padding:12px 14px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
  }
  .periodo-bar label{ font-size:.7rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.03em; }
  .periodo-bar input[type=date]{
    padding:6px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    font-size:.84rem;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    width:auto;
  }
  .periodo-atalhos{ display:flex; gap:6px; flex-wrap:wrap; width:100%; }
  .atalho-chip{
    padding:5px 11px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .atalho-chip.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  /* ---------- Tabela realizado/previsto ---------- */
  .fatur-table{ width:100%; border-collapse:collapse; font-size:.82rem; }
  .fatur-table th{
    text-align:left;
    font-size:.66rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    padding:6px 0 8px;
    border-bottom:2px solid var(--line);
  }
  .fatur-table th:not(:first-child){ text-align:right; }
  .fatur-table td{ padding:9px 0; border-bottom:1px solid var(--paper-deep); vertical-align:middle; }
  .fatur-table td:not(:first-child){ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .fatur-table tr.total-row td{ border-top:2px solid var(--line); border-bottom:none; font-weight:700; padding-top:11px; }
  .fatur-table tr.total-row td:first-child{ font-family:'Fraunces',serif; font-size:.9rem; }
  .cor-realizado{ color:var(--olive); }
  .cor-previsto{ color:var(--gold); }
  .cor-total{ color:var(--terra-deep); }

  /* ---------- Backup / Import / Export ---------- */
  .backup-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-export{ background:var(--olive); color:#fffdf9; }
  .btn-export:hover{ background:#4a5c2e; }
  .btn-import{ background:var(--gold); color:var(--ink); }
  .btn-import:hover{ background:#a37e28; }
  .btn-deslogar{ background:var(--rust); color:#fffdf9; }
  .btn-deslogar:hover{ background:#8a3220; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

// ===================== ESTADO E PERSISTÊNCIA =====================

const COLORS = ['#c1612f', '#5c6e3f', '#1f4f6e', '#a3402c', '#c79a3d'];

const NOMES_CASA_CURTO = {
  pvh: 'PVH',
  urupa01: 'Urupa01',
  urupa02: 'Urupa02',
  urupa03: 'Urupa03',
  colinapark: 'ColinaPark',
};

// Gera um sufixo estável (sem acentos/espaços) para nomear as abas no Sheets.
// Casas do seed original usam o mapa fixo (compatibilidade); casas novas geram a partir do nome.
function sufixoCasa(casaId){
  if(NOMES_CASA_CURTO[casaId]) return NOMES_CASA_CURTO[casaId];
  const casa = STATE.casas[casaId];
  const base = (casa && casa.nome) ? casa.nome : casaId;
  return base
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/[^a-zA-Z0-9]+/g,'')
    .slice(0, 24) || casaId;
}

let STATE = {

  periodoInicio: new Date().getFullYear() + '-01-01',
  periodoFim:    new Date().getFullYear() + '-12-31',
  sync: {
    status: 'local',
    ultimoSync: null,
    erro: null,
  },
};

const STORAGE_KEY = 'painel-casas-dados-v1';
const CONFIG_KEY = 'painel-casas-config-v1';
const LEGACY_ARTIFACT_KEY = 'painel-casas-v1'; // chave usada na versão artifact (window.storage)

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function getConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : { scriptUrl: '' };
  }catch(e){
    return { scriptUrl: '' };
  }
}
function setConfig(cfg){
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

// ----- Carregamento inicial: localStorage > migração de artifact > seed das planilhas -----

// Migração central: garante que todas as casas têm recebimentos[] e que reservas
// com valorRecebido legado foram convertidas em parcela 'recebido'.
// Idempotente: pode rodar várias vezes sem duplicar.
function migrarCasas(casas){
  Object.keys(casas).forEach(casaId => {
    const casa = casas[casaId];
    if(!casa.recebimentos) casa.recebimentos = [];

    casa.reservas.forEach(res => {
      const vlr = Number(res.valorRecebido) || 0;
      if(vlr > 0){
        // verifica se já existe parcela migrada para esta reserva (evita duplicar)
        const jaTemParcela = casa.recebimentos.some(r => r._reservaId === res.id);
        if(!jaTemParcela){
          // usa o mês da reserva como dataBaixa (ex: '2026-03' -> '2026-03-01')
          const dataBaixa = res.mes ? res.mes + '-01' : hojeISO();
          casa.recebimentos.push({
            id: uid(),
            _reservaId: res.id,           // link para rastreabilidade
            hospede: res.hospede || '',
            descricao: res.periodo ? 'Reserva ' + res.periodo : 'Reserva ' + (res.mes||''),
            avulso: false,                 // veio de uma reserva
            parcelas: [{
              id: uid(),
              valor: vlr,
              dataPrevista: dataBaixa,
              status: 'recebido',
              dataBaixa: dataBaixa,
            }],
          });
        }
        // zera o campo na reserva para não ser mais usado em cálculos
        res.valorRecebido = 0;
        res.valorBruto    = res.valorBruto    || 0;
        res.taxaLimpeza   = res.taxaLimpeza   || 0;
        res.descontos     = res.descontos     || 0;
        res.taxas         = res.taxas         || 0;
      }
    });
  });
  return casas;
}

async function carregarEstado(){
  // 1) Dados em localStorage
  const local = localStorage.getItem(STORAGE_KEY);
  if(local){
    try{
      STATE.casas = migrarCasas(JSON.parse(local));
      salvarLocal(); // persiste migração
      return;
    }catch(e){ /* segue para fallback */ }
  }

  // 2) Migração: versão anterior (artifact, window.storage)
  if(window.storage && typeof window.storage.get === 'function'){
    try{
      const saved = await window.storage.get(LEGACY_ARTIFACT_KEY, false);
      if(saved && saved.value){
        STATE.casas = migrarCasas(JSON.parse(saved.value));
        salvarLocal();
        return;
      }
    }catch(e){ /* não tinha dado legado */ }
  }

  // 3) Primeira vez: seed das planilhas originais
  const seedEl = document.getElementById('seed-data');
  const seed = JSON.parse(seedEl.textContent);
  const casas = {};
  Object.keys(seed).forEach(key => {
    const c = seed[key];
    casas[key] = {
      nome: c.nome,
      recebimentos: [],
      reservas: c.reservas.map(r => ({
        id: uid(),
        mes: r.mes,
        hospede: (r.hospede || '').trim(),
        periodo: r.periodo,
        dias: parseFloat(r.dias) || 0,
        adultos: r.adultos || 0,
        criancas: r.criancas || 0,
        canal: normalizaCanal(r.canal),
        // campos financeiros mantidos só para exibição no histórico, não usados em totais
        valorBruto:   r.valor_bruto   || 0,
        taxaLimpeza:  r.taxa_limpeza  || 0,
        descontos:    r.descontos     || 0,
        taxas:        r.taxas         || 0,
        valorRecebido: 0, // zerado intencionalmente — migrarCasas vai converter
      })),
      custos: c.custos.filter(x => x.data).map(x => ({
        id: uid(),
        data: x.data,
        diarista: x.diarista || 0,
        luz: x.luz || 0,
        agua: x.agua || 0,
        internet: x.internet || 0,
        lavadeira: x.lavadeira || 0,
        produtosLimpeza: x.produtos_limpeza || 0,
        manutencao: x.manutencao || 0,
        outros: x.outros && typeof x.outros === 'number' ? x.outros : 0,
        obs: x.outros && typeof x.outros === 'string' ? x.outros : '',
      })),
    };
    // injeta os valorRecebidos originais antes de migrar (o seed tem r.vlr_recebido)
    c.reservas.forEach((r, i) => {
      casas[key].reservas[i].valorRecebido = r.vlr_recebido || 0;
    });
  });
  STATE.casas = migrarCasas(casas);
  salvarLocal();
}

// Grava local imediatamente (síncrono, sem rede) — sempre a primeira coisa que acontece.
function salvarLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE.casas));
  }catch(e){
    console.error('Falha ao salvar localmente', e);
    mostrarToast('Não foi possível salvar neste aparelho.');
  }
}

// Ponto único chamado por toda ação de escrita: salva local na hora e agenda sync.
async function salvarEstado(opts){
  salvarLocal();
  agendarSync(opts && opts.imediato);
}

function normalizaCanal(c){
  if(!c) return 'Outro';
  const s = String(c).trim().toLowerCase();
  if(s.includes('airbnb')) return 'Airbnb';
  if(s.includes('booking')) return 'Booking';
  if(s.includes('pix')) return 'PIX';
  return 'Outro';
}

// ===================== GESTÃO DE CASAS =====================

function gerarCasaId(nome){
  const base = nome
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'casa';
  let id = base;
  let n = 2;
  while(STATE.casas[id]){
    id = base + '-' + n;
    n++;
  }
  return id;
}

async function adicionarCasa(nome){
  nome = (nome || '').trim();
  if(!nome) return null;
  const id = gerarCasaId(nome);
  STATE.casas[id] = { nome, reservas: [], custos: [] };
  await salvarEstado();
  return id;
}

async function renomearCasa(casaId, novoNome){
  novoNome = (novoNome || '').trim();
  if(!STATE.casas[casaId] || !novoNome) return;
  STATE.casas[casaId].nome = novoNome;
  await salvarEstado();
}

async function removerCasa(casaId){
  if(!STATE.casas[casaId]) return;
  delete STATE.casas[casaId];
  if(STATE.casaAtiva === casaId) STATE.casaAtiva = null;
  await salvarEstado({imediato:true}); // remoção é destrutiva, sincroniza já
}

// ===================== SINCRONIZAÇÃO COM GOOGLE SHEETS =====================
// Regra crítica: o LOCAL é sempre o master.
// - Se há dados locais ao conectar/sincronizar -> ENVIA para a nuvem (nunca lê, para não zerar a base local).
// - Só LÊ da nuvem quando o app está completamente vazio (aparelho novo, sem nenhum dado local).

let syncTimer = null;
const DEBOUNCE_MS = 3000;

function agendarSync(imediato){
  const cfg = getConfig();
  if(!cfg.scriptUrl) return; // sem planilha conectada, não faz nada
  clearTimeout(syncTimer);
  if(imediato){
    enviarParaNuvem();
  } else {
    syncTimer = setTimeout(enviarParaNuvem, DEBOUNCE_MS);
  }
}

function casaEstaVazia(){
  const ids = Object.keys(STATE.casas);
  if(ids.length === 0) return true;
  return ids.every(id => {
    const c = STATE.casas[id];
    return (!c.reservas || c.reservas.length===0) && (!c.custos || c.custos.length===0);
  });
}

function setSyncStatus(status, extra){
  STATE.sync.status = status;
  if(status === 'sincronizado') STATE.sync.ultimoSync = new Date();
  if(status === 'erro') STATE.sync.erro = extra || 'Erro desconhecido';
  if(status !== 'erro') STATE.sync.erro = null;
  atualizarBarraStatus();
}

async function enviarParaNuvem(){
  const cfg = getConfig();
  if(!cfg.scriptUrl) return;
  setSyncStatus('conectando');

  try{
    const lotes = montarLotesParaEnvio();
    for(let i=0; i<lotes.length; i++){
      const lote = lotes[i];
      const url = cfg.scriptUrl
        + '?action=write'
        + '&aba=' + encodeURIComponent(lote.aba)
        + '&append=' + (lote.append ? 'true' : 'false')
        + '&data=' + encodeURIComponent(JSON.stringify(lote.linhas));
      await fetchViaImagemOuJsonp(url);
    }
    setSyncStatus('sincronizado');
  }catch(e){
    console.error('Erro ao sincronizar', e);
    setSyncStatus('erro', e.message || 'Falha de conexão');
  }
}

// Quebra cada aba (Reservas_X / Custos_X) em lotes de ~10 linhas,
// porque URLs muito longas estouram limite do navegador em GET.
const TAMANHO_LOTE = 10;
const CABECALHO_CASAS = ['id','nome','sufixo'];

function montarLotesParaEnvio(){
  const lotes = [];

  // aba-índice: registra quais casas existem, para a leitura inicial num aparelho novo
  const linhasCasas = Object.keys(STATE.casas).map(casaId => [
    casaId, STATE.casas[casaId].nome, sufixoCasa(casaId),
  ]);
  empilharLotes(lotes, '_Casas', CABECALHO_CASAS, linhasCasas);

  Object.keys(STATE.casas).forEach(casaId => {
    const casa = STATE.casas[casaId];
    const sufixo = sufixoCasa(casaId);

    const linhasReservas = casa.reservas.map(r => [
      r.id, r.mes, r.hospede, r.periodo, r.dias, r.adultos, r.criancas,
      r.canal, r.valorBruto, r.taxaLimpeza, r.descontos, r.taxas, r.valorRecebido,
    ]);
    empilharLotes(lotes, 'Reservas_' + sufixo, CABECALHO_RESERVAS, linhasReservas);

    const linhasCustos = casa.custos.map(c => [
      c.id, c.data, c.diarista, c.luz, c.agua, c.internet, c.lavadeira,
      c.produtosLimpeza, c.manutencao, c.outros, c.obs,
    ]);
    empilharLotes(lotes, 'Custos_' + sufixo, CABECALHO_CUSTOS, linhasCustos);

    // Recebimentos: cada parcela vira uma linha (desnormalizamos para planilha plana)
    const linhasReceb = (casa.recebimentos||[]).flatMap(rec =>
      (rec.parcelas||[]).map(p => [
        rec.id, rec.hospede, rec.descricao, rec.casaId||casaId,
        p.id, p.valor, p.dataPrevista, p.status, p.dataBaixa||'',
      ])
    );
    empilharLotes(lotes, 'Recebimentos_' + sufixo, CABECALHO_RECEBIMENTOS, linhasReceb);
  });
  return lotes;
}

const CABECALHO_RESERVAS = ['id','mes','hospede','periodo','dias','adultos','criancas','canal','valorBruto','taxaLimpeza','descontos','taxas','valorRecebido'];
const CABECALHO_CUSTOS = ['id','data','diarista','luz','agua','internet','lavadeira','produtosLimpeza','manutencao','outros','obs'];
const CABECALHO_RECEBIMENTOS = ['recId','hospede','descricao','casaId','parcelaId','valor','dataPrevista','status','dataBaixa'];

function empilharLotes(lotes, aba, cabecalho, linhas){
  if(linhas.length === 0){
    // ainda envia um "lote zero" só com cabeçalho, para limpar a aba se ficou vazia
    lotes.push({ aba, append:false, linhas:[cabecalho] });
    return;
  }
  for(let i=0; i<linhas.length; i+=TAMANHO_LOTE){
    const pedaco = linhas.slice(i, i+TAMANHO_LOTE);
    const primeiro = i===0;
    lotes.push({
      aba,
      append: !primeiro,
      linhas: primeiro ? [cabecalho, ...pedaco] : pedaco,
    });
  }
}

// Lê da nuvem — só usado quando o app está vazio (aparelho novo).
// Primeiro lê a aba-índice "_Casas" para descobrir quais casas existem,
// depois lê Reservas_X / Custos_X de cada uma.
async function lerDaNuvem(){
  const cfg = getConfig();
  if(!cfg.scriptUrl) return false;
  setSyncStatus('conectando');
  try{
    const indice = await lerAbaDaNuvem(cfg.scriptUrl, '_Casas');
    if(indice.length === 0){
      setSyncStatus('erro', 'Planilha vazia ou ainda sem dados');
      return false;
    }
    const casasNovas = {};
    for(const linha of indice){
      const casaId = linha.id;
      const sufixo = linha.sufixo;
      const reservas = await lerAbaDaNuvem(cfg.scriptUrl, 'Reservas_' + sufixo);
      const custos   = await lerAbaDaNuvem(cfg.scriptUrl, 'Custos_'   + sufixo);
      const recebLinhas = await lerAbaDaNuvem(cfg.scriptUrl, 'Recebimentos_' + sufixo);

      casasNovas[casaId] = {
        nome: linha.nome || casaId,
        recebimentos: linhasParaRecebimentos(recebLinhas),
        reservas: reservas.map(linhaParaReserva),
        custos: custos.map(linhaParaCusto),
      };
    }
    STATE.casas = casasNovas;
    salvarLocal();
    setSyncStatus('sincronizado');
    return true;
  }catch(e){
    console.error('Erro ao ler da nuvem', e);
    setSyncStatus('erro', e.message || 'Falha ao ler a planilha');
    return false;
  }
}

async function lerAbaDaNuvem(scriptUrl, aba){
  const url = scriptUrl + '?action=read&aba=' + encodeURIComponent(aba);
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('Não foi possível ler ' + aba);
  const json = await resp.json();
  if(json.erro) throw new Error(json.erro);
  return json.linhas || [];
}

function linhaParaReserva(linha){
  // linha vem como objeto {id, mes, hospede, ...} a partir do cabeçalho
  return {
    id: linha.id || uid(),
    mes: linha.mes || '',
    hospede: linha.hospede || '',
    periodo: linha.periodo || '',
    dias: parseFloat(linha.dias) || 0,
    adultos: parseFloat(linha.adultos) || 0,
    criancas: parseFloat(linha.criancas) || 0,
    canal: normalizaCanal(linha.canal),
    valorBruto: parseFloat(linha.valorBruto) || 0,
    taxaLimpeza: parseFloat(linha.taxaLimpeza) || 0,
    descontos: parseFloat(linha.descontos) || 0,
    taxas: parseFloat(linha.taxas) || 0,
    valorRecebido: parseFloat(linha.valorRecebido) || 0,
  };
}
function linhaParaCusto(linha){
  return {
    id: linha.id || uid(),
    data: linha.data || '',
    diarista: parseFloat(linha.diarista) || 0,
    luz: parseFloat(linha.luz) || 0,
    agua: parseFloat(linha.agua) || 0,
    internet: parseFloat(linha.internet) || 0,
    lavadeira: parseFloat(linha.lavadeira) || 0,
    produtosLimpeza: parseFloat(linha.produtosLimpeza) || 0,
    manutencao: parseFloat(linha.manutencao) || 0,
    outros: parseFloat(linha.outros) || 0,
    obs: linha.obs || '',
  };
}

// Reconstrói recebimentos aninhados a partir de linhas planas do Sheets
function linhasParaRecebimentos(linhas){
  const mapa = {};
  linhas.forEach(l => {
    if(!l.recId) return;
    if(!mapa[l.recId]){
      mapa[l.recId] = { id: l.recId, hospede: l.hospede||'', descricao: l.descricao||'', parcelas: [] };
    }
    if(l.parcelaId){
      mapa[l.recId].parcelas.push({
        id: l.parcelaId,
        valor: parseFloat(l.valor) || 0,
        dataPrevista: l.dataPrevista || '',
        status: l.status || 'pendente',
        dataBaixa: l.dataBaixa || '',
      });
    }
  });
  return Object.values(mapa);
}

// GET simples — Apps Script aceita CORS em GET normalmente, mas alguns ambientes
// (arquivo local) bloqueiam fetch. Como o app vai ficar hospedado em GitHub Pages,
// fetch via GET funciona direto.
async function fetchViaImagemOuJsonp(url){
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('Falha de rede ao enviar dados (HTTP ' + resp.status + ')');
  const texto = await resp.text();
  let json;
  try{ json = JSON.parse(texto); }catch(e){ throw new Error('Resposta inesperada do Apps Script'); }
  if(json && json.erro) throw new Error(json.erro);
  return json;
}

// Conectar planilha: chamado pelo botão "Conectar planilha" na aba Configuração.
async function conectarPlanilha(url){
  const cfg = getConfig();
  cfg.scriptUrl = url.trim();
  setConfig(cfg);

  if(casaEstaVazia()){
    // aparelho novo, sem nada local -> tenta ler da nuvem
    await lerDaNuvem();
  } else {
    // já tem dados locais -> local é master, manda para a nuvem
    await enviarParaNuvem();
  }
  render();
}

async function sincronizarAgora(){
  const cfg = getConfig();
  if(!cfg.scriptUrl){
    mostrarToast('Conecte uma planilha primeiro');
    return;
  }
  await enviarParaNuvem();
  render();
}

function desconectarPlanilha(){
  const cfg = getConfig();
  cfg.scriptUrl = '';
  setConfig(cfg);
  STATE.sync.status = 'local';
  STATE.sync.ultimoSync = null;
  STATE.sync.erro = null;
  render();
}

function atualizarBarraStatus(){
  const el = document.getElementById('sync-status-bar');
  if(el) el.outerHTML = renderBarraStatus();
}

// ===================== HELPERS DE FORMATO =====================

function fmtMoeda(v){
  v = Number(v) || 0;
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:2});
}
function fmtMoedaCompacta(v){
  v = Number(v) || 0;
  const neg = v < 0;
  const abs = Math.abs(v);
  let out;
  if(abs >= 1000) out = 'R$ ' + (abs/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  else out = 'R$ ' + abs.toLocaleString('pt-BR',{maximumFractionDigits:0});
  return neg ? '-' + out : out;
}
function fmtMes(mesStr){
  if(!mesStr) return '—';
  const [y,m] = mesStr.split('-');
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[parseInt(m,10)-1] + ' ' + y;
}
function fmtData(dataStr){
  if(!dataStr) return '—';
  const [y,m,d] = dataStr.split('-');
  return `${d}/${m}/${y}`;
}
const fmtDataBR = fmtData;
function hojeISO(){
  return new Date().toISOString().slice(0,10);
}
function mesAtualISO(){
  return new Date().toISOString().slice(0,7);
}

function corDaCasa(casaId){
  const ids = Object.keys(STATE.casas);
  const idx = ids.indexOf(casaId);
  return COLORS[idx % COLORS.length];
}

// ===================== CÁLCULOS =====================

// Receita de uma casa = soma de todas as parcelas 'recebido'
// (fonte única de verdade financeira — reservas não carregam mais dinheiro)
function totalReceitaParcelas(casaId){
  const casa = STATE.casas[casaId];
  if(!casa) return 0;
  return (casa.recebimentos||[]).reduce((s, rec) =>
    s + (rec.parcelas||[]).reduce((ss, p) =>
      ss + (p.status === 'recebido' ? (p.valor||0) : 0), 0), 0);
}

function totalPrevistoParcelas(casaId){
  const casa = STATE.casas[casaId];
  if(!casa) return 0;
  return (casa.recebimentos||[]).reduce((s, rec) =>
    s + (rec.parcelas||[]).reduce((ss, p) =>
      ss + (p.status === 'pendente' ? (p.valor||0) : 0), 0), 0);
}

// Mantido para cálculo de custo de um lançamento individual
function totalCustoLancamento(c){
  return ['diarista','luz','agua','internet','lavadeira','produtosLimpeza','manutencao','outros']
    .reduce((s,k) => s + (Number(c[k]) || 0), 0);
}

function reservasDaCasa(casaId, filtroMes){
  const casa = STATE.casas[casaId];
  if(!casa) return [];
  let lista = casa.reservas.slice();
  if(filtroMes) lista = lista.filter(r => r.mes === filtroMes);
  if(STATE.filtroCanal !== 'todos') lista = lista.filter(r => r.canal === STATE.filtroCanal);
  return lista.sort((a,b) => (b.mes||'').localeCompare(a.mes||''));
}
function custosDaCasa(casaId){
  const casa = STATE.casas[casaId];
  if(!casa) return [];
  return casa.custos.slice().sort((a,b) => (b.data||'').localeCompare(a.data||''));
}

function resumoCasa(casaId){
  const casa = STATE.casas[casaId];
  if(!casa) return {receita:0, custos:0, liquido:0, diarias:0, reservasCount:0};
  const receita = totalReceitaParcelas(casaId);
  const custos  = casa.custos.reduce((s,c) => s + totalCustoLancamento(c), 0);
  const diarias = casa.reservas.reduce((s,r) => s + (Number(r.dias)||0), 0);
  return { receita, custos, liquido: receita - custos, diarias, reservasCount: casa.reservas.length };
}

function resumoGeral(){
  let receita=0, custos=0, diarias=0, reservasCount=0;
  Object.keys(STATE.casas).forEach(id => {
    const r = resumoCasa(id);
    receita += r.receita; custos += r.custos;
    diarias += r.diarias; reservasCount += r.reservasCount;
  });
  return {receita, custos, liquido: receita-custos, diarias, reservasCount};
}

// ---- Cálculos de recebimentos por período ----
// inicio/fim: strings 'YYYY-MM-DD'
function resumoRecebimentosPeriodo(inicio, fim){
  let realizado = 0, previsto = 0;
  Object.keys(STATE.casas).forEach(casaId => {
    const r = resumoRecebimentosCasaPeriodo(casaId, inicio, fim);
    realizado += r.realizado;
    previsto  += r.previsto;
  });
  return { realizado, previsto, total: realizado + previsto };
}

function resumoRecebimentosCasaPeriodo(casaId, inicio, fim){
  const casa = STATE.casas[casaId];
  if(!casa) return { realizado:0, previsto:0, total:0 };
  let realizado = 0, previsto = 0;
  (casa.recebimentos||[]).forEach(rec => {
    (rec.parcelas||[]).forEach(p => {
      if(p.status === 'recebido'){
        const d = p.dataBaixa || p.dataPrevista;
        if(d >= inicio && d <= fim) realizado += (p.valor||0);
      } else {
        if(p.dataPrevista >= inicio && p.dataPrevista <= fim) previsto += (p.valor||0);
      }
    });
  });
  return { realizado, previsto, total: realizado + previsto };
}

// Série mensal usando parcelas como fonte (não reservas)
function serieMensalCasa(casaId, metrica){
  const casa = STATE.casas[casaId];
  if(!casa) return {};
  const porMesReceita = {};  // mês → soma de parcelas recebidas
  const porMesPrevisto = {}; // mês → soma de parcelas pendentes
  const porMesCusto = {};

  (casa.recebimentos||[]).forEach(rec => {
    (rec.parcelas||[]).forEach(p => {
      if(p.status === 'recebido'){
        const mes = (p.dataBaixa || p.dataPrevista || '').slice(0,7);
        if(mes) porMesReceita[mes] = (porMesReceita[mes]||0) + (p.valor||0);
      } else {
        const mes = (p.dataPrevista||'').slice(0,7);
        if(mes) porMesPrevisto[mes] = (porMesPrevisto[mes]||0) + (p.valor||0);
      }
    });
  });
  casa.custos.forEach(c => {
    const mes = (c.data||'').slice(0,7);
    if(mes) porMesCusto[mes] = (porMesCusto[mes]||0) + totalCustoLancamento(c);
  });

  const todosMeses = new Set([
    ...Object.keys(porMesReceita),
    ...Object.keys(porMesPrevisto),
    ...Object.keys(porMesCusto),
  ]);
  const serie = {};
  todosMeses.forEach(mes => {
    const receita  = porMesReceita[mes]  || 0;
    const previsto = porMesPrevisto[mes] || 0;
    const custo    = porMesCusto[mes]    || 0;
    if(metrica === 'faturamento') serie[mes] = receita + previsto; // realizado + previsto
    else if(metrica === 'custo')  serie[mes] = custo;
    else serie[mes] = (receita + previsto) - custo; // lucro projetado
  });
  return serie;
}

async function darBaixaParcela(casaId, recebimentoId, parcelaId){
  const rec = (STATE.casas[casaId]?.recebimentos||[]).find(r=>r.id===recebimentoId);
  const p   = (rec?.parcelas||[]).find(p=>p.id===parcelaId);
  if(!p) return;
  p.status = 'recebido';
  p.dataBaixa = hojeISO();
  await salvarEstado();
}

async function estornarBaixaParcela(casaId, recebimentoId, parcelaId){
  const rec = (STATE.casas[casaId]?.recebimentos||[]).find(r=>r.id===recebimentoId);
  const p   = (rec?.parcelas||[]).find(p=>p.id===parcelaId);
  if(!p) return;
  p.status = 'pendente';
  p.dataBaixa = '';
  await salvarEstado();
}

async function excluirRecebimento(casaId, recebimentoId){
  const casa = STATE.casas[casaId];
  if(!casa) return;
  casa.recebimentos = (casa.recebimentos||[]).filter(r=>r.id!==recebimentoId);
  await salvarEstado();
}

// Atalhos de período para o painel
function atalhosPeriodo(){
  const ano = new Date().getFullYear();
  return [
    { label: 'Jan–Dez '  + ano,   inicio: ano+'-01-01',     fim: ano+'-12-31' },
    { label: 'Jan–Jun '  + ano,   inicio: ano+'-01-01',     fim: ano+'-06-30' },
    { label: 'Jul–Dez '  + ano,   inicio: ano+'-07-01',     fim: ano+'-12-31' },
    { label: (ano-1) + ' completo', inicio: (ano-1)+'-01-01', fim: (ano-1)+'-12-31' },
  ];
}

function mesesComDados(casaId){
  // considera meses de reservas E de parcelas de recebimento
  const casa = STATE.casas[casaId];
  if(!casa) return [];
  const set = new Set();
  casa.reservas.forEach(r => r.mes && set.add(r.mes));
  (casa.recebimentos||[]).forEach(rec =>
    (rec.parcelas||[]).forEach(p => {
      const m = (p.dataBaixa || p.dataPrevista || '').slice(0,7);
      if(m) set.add(m);
    })
  );
  return Array.from(set).sort();
}

// Une os meses de todas as casas selecionadas para servir de eixo X comum.
function mesesUnificados(casaIds){
  const set = new Set();
  casaIds.forEach(id => mesesComDados(id).forEach(m => set.add(m)));
  casaIds.forEach(id => {
    (STATE.casas[id]?.custos||[]).forEach(c => {
      const mes = (c.data||'').slice(0,7);
      if(mes) set.add(mes);
    });
  });
  return Array.from(set).sort();
}

  if(c.diarista) itens.push('Diarista');
  if(c.luz) itens.push('Luz');
  if(c.agua) itens.push('Água');
  if(c.internet) itens.push('Internet');
  if(c.lavadeira) itens.push('Lavadeira');
  if(c.produtosLimpeza) itens.push('Produtos de limpeza');
  if(c.manutencao) itens.push('Manutenção');
  if(c.outros) itens.push('Outros');
  return itens.length ? itens.join(' + ') : 'Lançamento de custo';
}

function renderGraficoLinha(casaIds, meses, metrica){
  const W = 720, H = 260;
  const padL = 50, padR = 16, padT = 16, padB = 34;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const series = casaIds.map(id => {
    const s = serieMensalCasa(id, metrica);
    return { id, valores: meses.map(m => s[m] || 0) };
  });

  let allValues = series.flatMap(s => s.valores);
  if(allValues.length === 0) allValues = [0];
  let max = Math.max(...allValues, 0);
  let min = Math.min(...allValues, 0);
  if(max === min){ max = max + 1; min = min - 1; }
  const range = max - min;

  const xFor = (i) => padL + (meses.length===1 ? innerW/2 : (i/(meses.length-1))*innerW);
  const yFor = (v) => padT + innerH - ((v-min)/range)*innerH;
  const yZero = yFor(0);

  // grade horizontal (4 linhas) com rótulo de valor
  const gridLines = [0,1,2,3,4].map(i => {
    const v = min + (range*i/4);
    const y = yFor(v);
    return `
      <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1" />
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9.5" fill="var(--ink-soft)" font-family="Inter">${fmtMoedaEixoY(v)}</text>
    `;
  }).join('');

  // linha de zero em destaque, caso esteja no meio da faixa (relevante para lucro negativo)
  const linhaZero = (min < 0 && max > 0) ? `<line x1="${padL}" y1="${yZero}" x2="${W-padR}" y2="${yZero}" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3,3" />` : '';

  const labelsX = meses.map((m,i) => `
    <text x="${xFor(i)}" y="${H-padB+18}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)" font-family="Inter">${fmtMesAbrev(m)}</text>
  `).join('');

  const linhas = series.map(s => {
    const cor = corDaCasa(s.id);
    const pontos = s.valores.map((v,i) => `${xFor(i)},${yFor(v)}`).join(' ');
    const circles = s.valores.map((v,i) => `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.4" fill="${cor}" />`).join('');
    return `<polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />${circles}`;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      ${linhaZero}
      ${linhas}
      ${labelsX}
    </svg>
    <div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--paper-deep);">
      ${casaIds.map(id => `
        <div style="display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--ink-soft); font-weight:600;">
          <span class="dot-inline" style="background:${corDaCasa(id)}; margin-right:0;"></span>${nomeCurto(STATE.casas[id].nome)}
        </div>
      `).join('')}
    </div>
  `;
}

function fmtMesAbrev(mesStr){
  const [y,m] = mesStr.split('-');
  const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return nomes[parseInt(m,10)-1] + '/' + y.slice(2);
}
function fmtMoedaEixoY(v){
  const abs = Math.abs(v);
  const sinal = v<0 ? '-' : '';
  if(abs >= 1000) return sinal + (abs/1000).toLocaleString('pt-BR',{maximumFractionDigits:0}) + 'k';
  return sinal + abs.toLocaleString('pt-BR',{maximumFractionDigits:0});
}

const CODIGO_APPS_SCRIPT = `function doGet(e) {
  var action = e.parameter.action;
  var aba = e.parameter.aba;
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (action === 'read') {
    return responderJSON(lerAba(ss, aba));
  }

  if (action === 'write') {
    var dados = JSON.parse(e.parameter.data);
    var append = e.parameter.append === 'true';
    escreverAba(ss, aba, dados, append);
    return responderJSON({ ok: true });
  }

  return responderJSON({ erro: 'Ação não reconhecida' });
}

function lerAba(ss, nomeAba) {
  var sheet = ss.getSheetByName(nomeAba);
  if (!sheet) return { linhas: [] };
  var valores = sheet.getDataRange().getValues();
  if (valores.length < 2) return { linhas: [] };
  var cabecalho = valores[0];
  var linhas = [];
  for (var i = 1; i < valores.length; i++) {
    var obj = {};
    for (var j = 0; j < cabecalho.length; j++) {
      obj[cabecalho[j]] = valores[i][j];
    }
    linhas.push(obj);
  }
  return { linhas: linhas };
}

function escreverAba(ss, nomeAba, linhas, append) {
  var sheet = ss.getSheetByName(nomeAba);
  if (!sheet) {
    sheet = ss.insertSheet(nomeAba);
  }
  if (!append) {
    sheet.clear();
  }
  if (linhas.length > 0) {
    var startRow = append ? sheet.getLastRow() + 1 : 1;
    sheet.getRange(startRow, 1, linhas.length, linhas[0].length).setValues(linhas);
  }
}

function responderJSON(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;

const modalRoot = () => document.getElementById('modal-root');

function abrirModalReserva(reservaExistente){
  const casaId = STATE.casaAtiva;
  const casa   = STATE.casas[casaId];
  const isEdit = !!reservaExistente;
  const r = reservaExistente || {
    id: null, mes: mesAtualISO(), hospede:'', periodo:'', dias:'', adultos:'', criancas:'', canal:'Airbnb',
  };

  // Busca recebimento já vinculado a esta reserva (para edição)
  const recExistente = isEdit
    ? (casa.recebimentos||[]).find(rec => rec._reservaId === r.id)
    : null;

  // parcelas temporárias — começa com 1 vazia (nova) ou com as existentes (edição)
  let parcelas = recExistente
    ? recExistente.parcelas.map(p => ({...p}))
    : [{ id: uid(), label:'Entrada/garantia', valor:'', dataPrevista: r.mes ? r.mes+'-01' : hojeISO(), status:'pendente', dataBaixa:'' }];

  function htmlParcela(p, i){
    const recebido = p.status === 'recebido';
    return `
      <div style="background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <div class="field" style="flex:2; min-width:100px; margin-bottom:0;">
            <label>Descrição</label>
            <input type="text" value="${esc(p.label||('Parcela '+(i+1)))}" data-p-label="${i}"
              placeholder="Ex: Entrada, Saldo...">
          </div>
          <div class="field" style="flex:1; min-width:80px; margin-bottom:0;">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" min="0" value="${p.valor||''}" data-p-valor="${i}">
          </div>
          <div class="field" style="flex:1; min-width:110px; margin-bottom:0;">
            <label>${recebido ? 'Data recebimento' : 'Data prevista'}</label>
            <input type="date" value="${recebido ? p.dataBaixa : p.dataPrevista}" data-p-data="${i}"
              ${recebido ? 'disabled style="opacity:.6"' : ''}>
          </div>
          <div class="field" style="flex:1; min-width:90px; margin-bottom:0;">
            <label>Status</label>
            <select data-p-status="${i}">
              <option value="pendente" ${!recebido?'selected':''}>Pendente</option>
              <option value="recebido" ${recebido?'selected':''}>Recebido</option>
            </select>
          </div>
          ${parcelas.length > 1 && !recebido
            ? `<button type="button" data-p-remover="${i}" style="color:var(--rust); background:none; border:none; font-size:1.1rem; cursor:pointer; padding:4px;">✕</button>`
            : '<div style="width:24px;"></div>'}
        </div>
      </div>
    `;
  }

  function montarModal(){
    modalRoot().innerHTML = `
      <div class="modal-backdrop open" id="backdrop">
        <div class="modal">
          <div class="modal-head">
            <h3>${isEdit ? 'Editar reserva' : 'Nova reserva'}</h3>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
          <form id="form-reserva" autocomplete="off">

            <!-- DADOS OPERACIONAIS -->
            <p style="font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 10px;">Dados da estadia</p>
            <div class="form-grid">
              <div class="field full">
                <label>Hóspede</label>
                <input type="text" name="hospede" value="${esc(r.hospede)}" placeholder="Nome do hóspede" required>
              </div>
              <div class="field">
                <label>Mês de referência</label>
                <input type="month" name="mes" value="${r.mes||''}">
              </div>
              <div class="field">
                <label>Canal</label>
                <select name="canal">
                  ${['Airbnb','Booking','PIX','Outro'].map(c=>`<option value="${c}" ${r.canal===c?'selected':''}>${c}</option>`).join('')}
                </select>
              </div>
              <div class="field full">
                <label>Período (ex: 12 a 15/06)</label>
                <input type="text" name="periodo" value="${esc(r.periodo)}" placeholder="Datas da estadia">
              </div>
              <div class="field">
                <label>Dias</label>
                <input type="number" step="1" min="0" name="dias" value="${r.dias}">
              </div>
              <div class="field">
                <label>Adultos</label>
                <input type="number" step="1" min="0" name="adultos" value="${r.adultos}">
              </div>
              <div class="field">
                <label>Crianças</label>
                <input type="number" step="1" min="0" name="criancas" value="${r.criancas}">
              </div>
            </div>

            <!-- PAGAMENTOS -->
            <div style="margin:18px 0 10px; display:flex; align-items:center; justify-content:space-between;">
              <p style="font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0;">
                Pagamentos desta reserva
              </p>
              <button type="button" id="btn-add-parcela-res" class="btn btn-ghost" style="padding:5px 10px; font-size:.74rem;">+ Parcela</button>
            </div>
            <div id="parcelas-res-container">
              ${parcelas.map((p,i) => htmlParcela(p,i)).join('')}
            </div>
            <p class="helper-text" style="margin-top:4px;">
              Use uma parcela para entrada/garantia e outra para o saldo no check-in. Parcelas com status "Recebido" entram nos totais do painel.
            </p>

            <div style="display:flex; gap:10px; margin-top:20px;">
              ${isEdit ? `<button type="button" class="btn btn-ghost" id="btn-excluir-reserva">Excluir</button>` : ''}
              <button type="submit" class="btn btn-primary btn-block">${isEdit ? 'Salvar' : 'Lançar reserva'}</button>
            </div>
          </form>
        </div>
      </div>
    `;

    document.getElementById('modal-close').onclick = fecharModal;
    document.getElementById('backdrop').addEventListener('click', e => { if(e.target.id==='backdrop') fecharModal(); });

    ligarParcelasReserva();

    document.getElementById('btn-add-parcela-res').onclick = () => {
      parcelas.push({ id: uid(), label:'Saldo', valor:'', dataPrevista: hojeISO(), status:'pendente', dataBaixa:'' });
      document.getElementById('parcelas-res-container').innerHTML = parcelas.map(htmlParcela).join('');
      ligarParcelasReserva();
    };

    document.getElementById('form-reserva').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);

      // Lê parcelas do DOM no momento do submit
      const parcelasFinais = parcelas.map((p,i) => {
        const status = document.querySelector(`[data-p-status="${i}"]`)?.value || 'pendente';
        const dataVal = document.querySelector(`[data-p-data="${i}"]`)?.value || hojeISO();
        return {
          id: p.id,
          label: document.querySelector(`[data-p-label="${i}"]`)?.value?.trim() || ('Parcela '+(i+1)),
          valor: parseFloat(document.querySelector(`[data-p-valor="${i}"]`)?.value)||0,
          dataPrevista: status==='recebido' ? p.dataPrevista : dataVal,
          status,
          dataBaixa: status==='recebido' ? (p.dataBaixa || dataVal) : '',
        };
      }).filter(p => p.valor > 0);

      const novaReserva = {
        id: isEdit ? r.id : uid(),
        mes: fd.get('mes') || r.mes,
        hospede: fd.get('hospede').trim(),
        periodo: fd.get('periodo').trim(),
        dias: parseFloat(fd.get('dias'))||0,
        adultos: parseFloat(fd.get('adultos'))||0,
        criancas: parseFloat(fd.get('criancas'))||0,
        canal: fd.get('canal'),
        valorBruto: 0, taxaLimpeza:0, descontos:0, taxas:0, valorRecebido:0,
      };

      if(isEdit){
        const idx = casa.reservas.findIndex(x => x.id === r.id);
        if(idx > -1) casa.reservas[idx] = novaReserva;
        // atualiza ou cria o recebimento vinculado
        if(recExistente){
          recExistente.hospede  = novaReserva.hospede;
          recExistente.descricao = novaReserva.periodo || novaReserva.mes;
          recExistente.parcelas  = parcelasFinais;
        } else if(parcelasFinais.length > 0){
          casa.recebimentos = casa.recebimentos || [];
          casa.recebimentos.push({
            id: uid(), _reservaId: novaReserva.id,
            hospede: novaReserva.hospede,
            descricao: novaReserva.periodo || novaReserva.mes,
            avulso: false,
            parcelas: parcelasFinais,
          });
        }
      } else {
        casa.reservas.push(novaReserva);
        if(parcelasFinais.length > 0){
          casa.recebimentos = casa.recebimentos || [];
          casa.recebimentos.push({
            id: uid(), _reservaId: novaReserva.id,
            hospede: novaReserva.hospede,
            descricao: novaReserva.periodo || novaReserva.mes,
            avulso: false,
            parcelas: parcelasFinais,
          });
        }
      }

      await salvarEstado();
      fecharModal(); render();
      mostrarToast(isEdit ? 'Reserva atualizada' : 'Reserva lançada');
    };

    if(isEdit){
      document.getElementById('btn-excluir-reserva').onclick = async () => {
        if(!confirm('Excluir reserva e seus pagamentos?')) return;
        casa.reservas = casa.reservas.filter(x => x.id !== r.id);
        if(recExistente){
          casa.recebimentos = (casa.recebimentos||[]).filter(x => x.id !== recExistente.id);
        }
        await salvarEstado();
        fecharModal(); render();
        mostrarToast('Reserva excluída');
      };
    }
  }

  function ligarParcelasReserva(){
    document.querySelectorAll('[data-p-remover]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.getAttribute('data-p-remover'));
        parcelas.splice(i,1);
        document.getElementById('parcelas-res-container').innerHTML = parcelas.map(htmlParcela).join('');
        ligarParcelasReserva();
      };
    });
    // ao mudar status para 'recebido', congela a data e coloca hoje; reverter desgela
    document.querySelectorAll('[data-p-status]').forEach(sel => {
      sel.onchange = () => {
        const i = parseInt(sel.getAttribute('data-p-status'));
        const dataInput = document.querySelector(`[data-p-data="${i}"]`);
        if(sel.value === 'recebido'){
          parcelas[i].dataBaixa = dataInput?.value || hojeISO();
          parcelas[i].status = 'recebido';
          if(dataInput){ dataInput.disabled = true; dataInput.style.opacity = '.6'; }
        } else {
          parcelas[i].status = 'pendente';
          parcelas[i].dataBaixa = '';
          if(dataInput){ dataInput.disabled = false; dataInput.style.opacity = '1'; }
        }
      };
    });
  }

  montarModal();
}

// Modal de recebimento (novo ou edição)
function abrirModalRecebimento(casaId, recExistente){
  const isEdit = !!recExistente;
  const ids = Object.keys(STATE.casas);

  // estado temporário das parcelas dentro do modal (array de {valor, dataPrevista})
  let parcelas = isEdit
    ? recExistente.parcelas.map(p => ({ id:p.id, valor:p.valor, dataPrevista:p.dataPrevista, status:p.status, dataBaixa:p.dataBaixa||'' }))
    : [{ id:uid(), valor:'', dataPrevista:hojeISO(), status:'pendente', dataBaixa:'' }];

  function montarModal(){
    modalRoot().innerHTML = `
      <div class="modal-backdrop open" id="backdrop">

          <div class="modal-head">
            <h3>${isEdit ? 'Editar recebimento' : 'Novo recebimento'}</h3>

                </select>
              </div>
              <div class="field full">
                <label>Hóspede / Cliente</label>
                <input type="text" name="hospede" value="${esc(isEdit?recExistente.hospede:'')}" placeholder="Nome do hóspede" required>
              </div>
              <div class="field full">

              </div>
            </div>

            <div style="margin:18px 0 10px; display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);">Parcelas</span>
              <button type="button" id="btn-add-parcela" class="btn btn-ghost" style="padding:6px 12px; font-size:.76rem;">+ Parcela</button>
            </div>

            <div id="parcelas-container">
              ${parcelas.map((p,i) => htmlParcela(p, i)).join('')}

          </form>
        </div>
      </div>

    document.getElementById('btn-add-parcela').onclick = () => {

      document.getElementById('parcelas-container').innerHTML = parcelas.map((p,i)=>htmlParcela(p,i)).join('');
      ligarBotoesRemoverParcela();
    };
    ligarBotoesRemoverParcela();

    if(isEdit){
      document.getElementById('btn-excluir-receb-modal').onclick = async () => {
        if(!confirm('Excluir este recebimento e todas as parcelas?')) return;

        fecharModal(); render(); mostrarToast('Recebimento excluído');
      };

    document.getElementById('form-receb').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const cid = fd.get('casaId');
      // lê parcelas do DOM no momento do submit
      const parcelasFinais = parcelas.map((p,i) => ({
        id: p.id,
        valor: parseFloat(document.querySelector(`[data-parcela-valor="${i}"]`)?.value)||0,
        dataPrevista: document.querySelector(`[data-parcela-data="${i}"]`)?.value || hojeISO(),
        status: p.status,
        dataBaixa: p.dataBaixa,
      })).filter(p => p.valor > 0);

      if(parcelasFinais.length === 0){ mostrarToast('Informe pelo menos uma parcela com valor'); return; }

      const novoRec = {
        id: isEdit ? recExistente.id : uid(),
        hospede: fd.get('hospede').trim(),
        descricao: fd.get('descricao').trim(),
        parcelas: parcelasFinais,
      };

      // se mudou de casa no select, remove da casa antiga (se edit) e adiciona na nova
      if(!STATE.casas[cid].recebimentos) STATE.casas[cid].recebimentos = [];
      if(isEdit){
        const casaOrigem = recExistente._casaId || casaId;
        if(casaOrigem !== cid){
          STATE.casas[casaOrigem].recebimentos = (STATE.casas[casaOrigem].recebimentos||[]).filter(r=>r.id!==recExistente.id);
        } else {
          const idx = STATE.casas[cid].recebimentos.findIndex(r=>r.id===recExistente.id);
          if(idx>-1){ STATE.casas[cid].recebimentos[idx] = novoRec; }
          else STATE.casas[cid].recebimentos.push(novoRec);
        }
      } else {
        STATE.casas[cid].recebimentos.push(novoRec);
      }

      await salvarEstado();
      fecharModal(); render(); mostrarToast(isEdit?'Recebimento atualizado':'Recebimento cadastrado');
    };
  }

  function htmlParcela(p, i){
    return `
      <div class="parcela-row" style="border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <div class="parcela-info" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:1;">
          <div class="field" style="flex:1; min-width:90px; margin-bottom:0;">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" min="0" value="${p.valor||''}"
              data-parcela-valor="${i}" placeholder="0,00">
          </div>
          <div class="field" style="flex:1; min-width:130px; margin-bottom:0;">
            <label>Data prevista</label>
            <input type="date" value="${p.dataPrevista||''}"
              data-parcela-data="${i}">
          </div>
        </div>
        ${parcelas.length > 1 ? `<button type="button" class="btn-baixa" style="color:var(--rust);" data-remover-parcela="${i}">✕</button>` : ''}
      </div>
    `;
  }

  function ligarBotoesRemoverParcela(){
    document.querySelectorAll('[data-remover-parcela]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.getAttribute('data-remover-parcela'));
        parcelas.splice(i,1);
        document.getElementById('parcelas-container').innerHTML = parcelas.map((p,i)=>htmlParcela(p,i)).join('');
        ligarBotoesRemoverParcela();
      };
    });
  }

  montarModal();
}


function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/"/g,'&quot;');
}

let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- Mapeamento de abas para export ----
// Cada aba do XLSX corresponde a uma entidade de uma casa.
// Estrutura: reservas, custos, recebimentos (parcelas denormalizadas).

function exportarXLSX(){
  if(typeof XLSX === 'undefined'){
    mostrarToast('Biblioteca XLSX ainda carregando, tente em 2s');
    return;
  }
  const wb = XLSX.utils.book_new();

  Object.keys(STATE.casas).forEach(casaId => {
    const casa = STATE.casas[casaId];
    const sufixo = (NOMES_CASA_CURTO[casaId] || casaId).slice(0,20);

    // ---- Aba Reservas ----
    const hdReservas = ['ID','Mes','Hospede','Periodo','Dias','Adultos','Criancas','Canal'];
    const linhasReservas = [hdReservas].concat(
      (casa.reservas||[]).map(r => [
        String(r.id),        // ID como string (evita notacao cientifica no Excel)
        r.mes || '',
        r.hospede || '',
        r.periodo || '',
        r.dias || 0,
        r.adultos || 0,
        r.criancas || 0,
        r.canal || '',
      ])
    );
    const wsRes = XLSX.utils.aoa_to_sheet(linhasReservas);
    XLSX.utils.book_append_sheet(wb, wsRes, ('Res_' + sufixo).slice(0,31));

    // ---- Aba Custos ----
    const hdCustos = ['ID','Data','Diarista','Luz','Agua','Internet','Lavadeira','ProdutosLimpeza','Manutencao','Outros','Obs'];
    const linhasCustos = [hdCustos].concat(
      (casa.custos||[]).map(c => [
        String(c.id),
        c.data || '',        // datas sempre como string YYYY-MM-DD
        c.diarista || 0,
        c.luz || 0,
        c.agua || 0,
        c.internet || 0,
        c.lavadeira || 0,
        c.produtosLimpeza || 0,
        c.manutencao || 0,
        c.outros || 0,
        c.obs || '',
      ])
    );
    const wsCus = XLSX.utils.aoa_to_sheet(linhasCustos);
    XLSX.utils.book_append_sheet(wb, wsCus, ('Cus_' + sufixo).slice(0,31));

    // ---- Aba Recebimentos (parcelas denormalizadas) ----
    const hdReceb = ['RecID','ReservaID','Hospede','Descricao','Avulso','ParcelaID','Valor','DataPrevista','Status','DataBaixa'];
    const linhasReceb = [hdReceb].concat(
      (casa.recebimentos||[]).flatMap(rec =>
        (rec.parcelas||[]).map(p => [
          String(rec.id),
          String(rec._reservaId || ''),
          rec.hospede || '',
          rec.descricao || '',
          rec.avulso ? 'sim' : 'nao',
          String(p.id),
          p.valor || 0,
          p.dataPrevista || '',   // string YYYY-MM-DD
          p.status || 'pendente',
          p.dataBaixa || '',      // string YYYY-MM-DD
        ])
      )
    );
    const wsRec = XLSX.utils.aoa_to_sheet(linhasReceb);
    XLSX.utils.book_append_sheet(wb, wsRec, ('Rec_' + sufixo).slice(0,31));
  });

  // Aba-indice de casas
  const hdCasas = ['ID','Nome'];
  const linhasCasas = [hdCasas].concat(
    Object.keys(STATE.casas).map(id => [String(id), STATE.casas[id].nome])
  );
  const wsCasas = XLSX.utils.aoa_to_sheet(linhasCasas);
  XLSX.utils.book_append_sheet(wb, wsCasas, '_Casas');

  const dataHoje = new Date().toISOString().slice(0,10).replace(/-/g,'');
  XLSX.writeFile(wb, 'painel-casas-backup-' + dataHoje + '.xlsx');
  mostrarToast('Excel exportado com sucesso');
}

// ---- Import ----
// Regras:
// 1. cellDates: false no XLSX.read() — datas chegam como numero serial, convertemos via toDateStr
// 2. Verificar duplicatas por ID antes de inserir
// 3. Disparo imediato de sync apos import (nao espera debounce)

function toDateStr(val){
  // converte numero serial Excel para string YYYY-MM-DD
  if(!val) return '';
  if(typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}/)) return val.slice(0,10);
  if(typeof val === 'number'){
    // numero serial Excel: dias desde 1900-01-01 (com bug do ano bissexto 1900)
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  if(val instanceof Date) return val.toISOString().slice(0,10);
  return String(val).slice(0,10);
}

function importarArquivo(){
  const input = document.getElementById('input-arquivo');
  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      // cellDates: false -- deixa a conversao para toDateStr()
      const wb = XLSX.read(e.target.result, { type:'array', cellDates: false });
      let importados = 0, ignorados = 0;

      // Le aba-indice de casas se existir
      if(wb.SheetNames.includes('_Casas')){
        const ws = wb.Sheets['_Casas'];
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
        rows.slice(1).forEach(row => {
          const [id, nome] = row;
          if(id && !STATE.casas[id]){
            STATE.casas[String(id)] = { nome: nome||String(id), reservas:[], custos:[], recebimentos:[] };
          }
        });
      }

      // Para cada casa existente, importa Reservas, Custos e Recebimentos
      Object.keys(STATE.casas).forEach(casaId => {
        const sufixo = (NOMES_CASA_CURTO[casaId] || casaId).slice(0,20);
        const casa = STATE.casas[casaId];
        const idsExistentes = {
          reservas:    new Set((casa.reservas||[]).map(r => r.id)),
          custos:      new Set((casa.custos||[]).map(c => c.id)),
          recebimentos:new Set((casa.recebimentos||[]).map(r => r.id)),
        };

        // Reservas
        const nomeAbaRes = 'Res_' + sufixo;
        if(wb.SheetNames.some(n => n.startsWith('Res_' + sufixo.slice(0,15)))){
          const abaRes = wb.SheetNames.find(n => n.startsWith('Res_' + sufixo.slice(0,15)));
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[abaRes], { header:1, defval:'' });
          rows.slice(1).forEach(row => {
            const [id, mes, hospede, periodo, dias, adultos, criancas, canal] = row;
            if(!id) return;
            if(idsExistentes.reservas.has(String(id))){ ignorados++; return; }
            casa.reservas.push({
              id: String(id), mes: String(mes||''), hospede: String(hospede||''),
              periodo: String(periodo||''), dias: Number(dias)||0,
              adultos: Number(adultos)||0, criancas: Number(criancas)||0,
              canal: String(canal||'Outro'), valorBruto:0, taxaLimpeza:0,
              descontos:0, taxas:0, valorRecebido:0,
            });
            idsExistentes.reservas.add(String(id));
            importados++;
          });
        }

        // Custos
        if(wb.SheetNames.some(n => n.startsWith('Cus_' + sufixo.slice(0,15)))){
          const abaCus = wb.SheetNames.find(n => n.startsWith('Cus_' + sufixo.slice(0,15)));
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[abaCus], { header:1, defval:'' });
          rows.slice(1).forEach(row => {
            const [id, data, diarista, luz, agua, internet, lavadeira, produtosLimpeza, manutencao, outros, obs] = row;
            if(!id) return;
            if(idsExistentes.custos.has(String(id))){ ignorados++; return; }
            casa.custos.push({
              id: String(id), data: toDateStr(data),
              diarista: Number(diarista)||0, luz: Number(luz)||0,
              agua: Number(agua)||0, internet: Number(internet)||0,
              lavadeira: Number(lavadeira)||0, produtosLimpeza: Number(produtosLimpeza)||0,
              manutencao: Number(manutencao)||0, outros: Number(outros)||0,
              obs: String(obs||''),
            });
            idsExistentes.custos.add(String(id));
            importados++;
          });
        }

        // Recebimentos (denormalizados -> reagrupar por RecID)
        if(wb.SheetNames.some(n => n.startsWith('Rec_' + sufixo.slice(0,15)))){
          const abaRec = wb.SheetNames.find(n => n.startsWith('Rec_' + sufixo.slice(0,15)));
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[abaRec], { header:1, defval:'' });
          const mapaRec = {};
          rows.slice(1).forEach(row => {
            const [recId, reservaId, hospede, descricao, avulso, parcelaId, valor, dataPrevista, status, dataBaixa] = row;
            if(!recId) return;
            const recIdStr = String(recId);
            if(!mapaRec[recIdStr]){
              mapaRec[recIdStr] = {
                id: recIdStr,
                _reservaId: String(reservaId||''),
                hospede: String(hospede||''),
                descricao: String(descricao||''),
                avulso: String(avulso||'') === 'sim',
                parcelas:[],
              };
            }
            if(parcelaId){
              mapaRec[recIdStr].parcelas.push({
                id: String(parcelaId),
                valor: Number(valor)||0,
                dataPrevista: toDateStr(dataPrevista),
                status: String(status||'pendente'),
                dataBaixa: toDateStr(dataBaixa),
              });
            }
          });
          // insere somente recebimentos que nao existem
          Object.values(mapaRec).forEach(rec => {
            if(idsExistentes.recebimentos.has(rec.id)){ ignorados++; return; }
            casa.recebimentos.push(rec);
            idsExistentes.recebimentos.add(rec.id);
            importados++;
          });
        }
      });

      salvarLocal(); // salva local imediatamente
      agendarSync(true); // sync imediato (nao debounce) — conforme regra do prompt
      render();
      mostrarToast(`Import OK: ${importados} registros inseridos, ${ignorados} duplicatas ignoradas`);
    }catch(err){
      console.error('Erro ao importar', err);
      mostrarToast('Erro ao ler o arquivo: ' + err.message);
    } finally {
      input.value = ''; // limpa o input para permitir reimportar o mesmo arquivo
    }
  };
  reader.readAsArrayBuffer(file);
}

function deslogar(){
  if(!confirm('\u26A0\uFE0F Isso vai apagar TODOS os dados deste aparelho.\n\nVoce ja exportou o backup em Excel? Esta acao nao pode ser desfeita.')) return;
  localStorage.clear();
  location.reload();
}
